services:
  postgres:
    image: postgres:16
    container_name: ai-risk-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ai_risk_investigator
      POSTGRES_USER: risk_admin
      POSTGRES_PASSWORD: risk_dev_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: